# Junteng Liu's academic homepage
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Junteng Liu — PhD candidate at HKUST NLP Group. Research on natural language processing and machine learning."
url: "https://spanellisnikolaos564-blip.github.io"
baseurl: "/LJT-Homepage"
repository: "spanellisnikolaos564-blip/LJT-Homepage"

author:
  name: "Junteng Liu"
  bio: "PhD candidate in Computer Science at HKUST NLP Group"
  employer: "Hong Kong University of Science and Technology"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false
comments:
  provider:
atom_feed:
  hide: true

# SEO / social metadata
google_site_verification:
bing_site_verification:
alexa_site_verification:
yandex_site_verification:
twitter:
  username: &twitter "junteng88716710"
facebook:
  username:
  app_id:
  publisher:
og_image:
og_description: *description
social:
  type: Person
  name: "Junteng Liu"
  links:
    - "https://github.com/Vicent0205"
    - "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
    - "https://twitter.com/junteng88716710"
analytics:
  provider: "false"
  google:
    tracking_id:

include:
  - _pages
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - AGENTS.md
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - docker-compose.yaml
  - Dockerfile
  - files
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - images
  - LICENSE
  - local
  - log
  - markdown_generator
  - node_modules
  - package.json*
  - Rakefile
  - README
  - scripts
  - talkmap
  - talkmap.ipynb
  - talkmap.py
  - talkmap_out.ipynb
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Render only the existing About and Publications pages. Publication
# records are shared between both pages without generating extra pages.
collections:
  publications:
    output: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed
permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-sitemap
  - jemoji
whitelist:
  - jekyll-sitemap
  - jemoji

compress_html:
  clippings: all
  ignore:
    envs: development
