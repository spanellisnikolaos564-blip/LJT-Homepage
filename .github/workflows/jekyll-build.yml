name: Build and deploy homepage

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Verify homepage content and page list
        run: |
          ruby -ryaml -rcgi <<'RUBY'
          publications = YAML.load_file('_data/publications.yml')
          about = CGI.unescapeHTML(File.read('_site/index.html'))
          publication_page = CGI.unescapeHTML(File.read('_site/publications/index.html'))
          publications.each do |publication|
            [about, publication_page].each do |page|
              raise "Missing publication: #{publication['title']}" unless page.include?(publication['title'])
              publication['authors'].each do |author|
                raise "Missing author #{author}" unless page.include?(author)
              end
              raise "Missing publication year" unless page.include?(publication['year'].to_s)
              raise "Missing publication venue" unless page.include?(publication['venue'])
            end
          end
          ['Research Interests & Skills', 'Education', 'Research Experience', 'Publications', 'Contact',
           'jliugi@connect.ust.hk', 'https://github.com/Vicent0205', '@junteng88716710',
           'Professor Junxian He', 'Zifei Shan', 'Prof. Yu Cheng', 'Zhiyuan Honor Scholarship',
           'MINIMAX', 'Tencent WXG', 'Shanghai AI Lab'].each do |detail|
            raise "Missing About detail: #{detail}" unless about.include?(detail)
          end
          pages = Dir.glob('_site/**/*.html').map { |path| path.sub('_site/', '') }.sort
          raise "Unexpected additional pages: #{pages.inspect}" unless pages == ['404.html', 'index.html', 'publications/index.html']
          ['Paper Title Number', 'Your Name', 'github.io/markdown', '/talks/', '/teaching/', '/cv/'].each do |placeholder|
            [about, publication_page].each do |page|
              raise "Unremoved template content: #{placeholder}" if page.include?(placeholder)
            end
          end
          puts "Verified all #{publications.length} publications on both pages and all required About sections."
          RUBY

      - name: Deploy to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          commit_message: Publish Junteng Liu's academic homepage

      - name: Check public homepage
        run: |
          curl --silent --show-error --location --max-time 30 \
            --output /tmp/ljt-homepage.html --write-out 'Homepage HTTP status: %{http_code}\n' \
            'https://spanellisnikolaos564-blip.github.io/LJT-Homepage/'
          if grep -q 'SynLogic: Synthesizing Verifiable Reasoning Data at Scale' /tmp/ljt-homepage.html; then
            echo 'The public homepage contains the expected publication content.'
          else
            echo 'The public homepage is not yet serving the built site.'
            exit 1
          fi
